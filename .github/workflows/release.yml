name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

      - name: Check release version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          package_tag="v$(npm pkg get version | tr -d '"')"
          if [ "$TAG" != "$package_tag" ]; then
            echo "::error::tag $TAG does not match package.json ($package_tag)"
            exit 1
          fi

      - name: Pack release assets
        run: |
          tarball=$(npm pack --silent | tail -1)
          echo "tarball=$tarball" >> "$GITHUB_ENV"
          cp "$tarball" moho-mcp-server.tgz
          (cd moho-plugin && zip -r ../moho-mcp-plugin.zip Menu Modules)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            "$tarball" \
            moho-mcp-server.tgz \
            moho-mcp-plugin.zip \
            install-plugin.sh \
            install-plugin.bat \
            dist/moho-mcp-server.mjs
